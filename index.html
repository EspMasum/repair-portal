<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electronics Repair Center — Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Electronics Repair Center</h1>
        <p class="text-sm text-slate-600">Submit fault photos, audio, or short clips and track all your repairs.</p>
      </div>
      <div id="user-bar" class="hidden flex items-center gap-3 bg-white border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm">
        <div class="text-right">
          <p id="header-user-name" class="text-xs font-semibold text-slate-900"></p>
          <p id="header-user-meta" class="text-[11px] text-slate-500"></p>
        </div>
        <button id="logout-btn" type="button"
          class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100">
          Sign Out
        </button>
      </div>
    </header>

    <!-- AUTH VIEW (LOGIN / REGISTER) -->
    <section id="auth-section" class="max-w-lg mx-auto bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
        <button id="auth-tab-login" type="button" class="py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900">
          Sign In
        </button>
        <button id="auth-tab-register" type="button" class="py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900">
          Register Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email Address *</label>
          <input type="email" id="login-email" required placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password *</label>
          <input type="password" id="login-password" required placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-2.5"></div>
        <button type="submit" id="login-submit"
          class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm">
          Sign In
        </button>
      </form>

      <!-- Expanded Register Form -->
      <form id="register-form" class="hidden space-y-4">
        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="Tanvir Ahmed"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Phone Number (BD) *</label>
            <input type="tel" id="reg-phone" required placeholder="017XXXXXXXX"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Email Address (for verification) *</label>
            <input type="email" id="reg-email" required placeholder="you@example.com"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password (min 6 chars) *</label>
            <input type="password" id="reg-password" minlength="6" required placeholder="••••••••"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Business Name</label>
            <input type="text" id="reg-business-name" placeholder="Optional / Shop or Company"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Business Type</label>
            <select id="reg-business-type"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
              <option value="">Individual / Not Applicable</option>
              <option value="Retail Shop">Retail Shop</option>
              <option value="Corporate / Office">Corporate / Office</option>
              <option value="Service / Reseller">Service / Reseller</option>
              <option value="Other Business">Other Business</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Business / Pickup Address</label>
          <input type="text" id="reg-business-address" placeholder="Street, Area, Dhaka / District"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>

        <div id="reg-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-2.5"></div>
        <div id="reg-info" class="hidden text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2.5"></div>

        <button type="submit" id="reg-submit"
          class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm">
          Create Account & Send Verification
        </button>
      </form>
    </section>

    <!-- LOGGED-IN CUSTOMER APP -->
    <main id="app-section" class="hidden space-y-6">
      <div class="grid grid-cols-2 gap-2 bg-slate-200/80 p-1 rounded-xl">
        <button id="tab-new-ticket" type="button" class="py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900">
          + New Repair Request
        </button>
        <button id="tab-my-tickets" type="button" class="py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900">
          My Repair Tickets
        </button>
      </div>

      <!-- NEW TICKET FORM -->
      <section id="panel-new-ticket" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">
        <form id="repair-form" class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Contact Name *</label>
              <input type="text" id="customer_name" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Mobile Number (BD) *</label>
              <input type="tel" id="phone_number" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Device Type *</label>
              <select id="device_type" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
                <option value="">Select device...</option>
                <option value="Smartphone">Smartphone</option>
                <option value="Laptop">Laptop</option>
                <option value="Audio / Speaker / Earbuds">Audio / Speaker / Earbuds</option>
                <option value="Home Appliance">Home Appliance</option>
                <option value="Other Electronics">Other Electronics</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Brand & Model *</label>
              <input type="text" id="device_model" required placeholder="e.g., Redmi Note 13 / HP Pavilion"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>

          <div class="space-y-3 bg-slate-50 border border-slate-200 rounded-xl p-4">
            <div>
              <label class="block text-sm font-medium mb-1">Where Should Repair / Servicing Happen? *</label>
              <select id="service_location" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
                <option value="Drop-off at Shop">Drop-off at Repair Shop</option>
                <option value="At Customer Location">At My Location (On-Site / Home Service)</option>
              </select>
            </div>
            <div id="service-address-wrap" class="hidden">
              <label class="block text-sm font-medium mb-1">Your Address / Area *</label>
              <input type="text" id="service_address" placeholder="House/Road, Area, City (e.g., Dhanmondi 8A, Dhaka)"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Describe the Fault or Servicing Needed *</label>
            <textarea id="issue_description" rows="4" required
              placeholder="Describe the fault or servicing job needed, when it started, and any preferred time..."
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">
              Photos, Audio Notes, or Short Videos (Add one by one or together, max 5 files, 25 MB each)
            </label>
            <input type="file" id="media_files" multiple
              accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,audio/mpeg,audio/mp4,audio/webm,audio/ogg,audio/wav"
              class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
            <p id="file-summary" class="text-xs text-slate-500 mt-1">No files selected.</p>
            <div id="queued-files-list" class="mt-2 space-y-1.5"></div>
          </div>

          <div id="submit-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>

          <button id="submit-btn" type="submit"
            class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold text-sm transition">
            Submit Repair Request
          </button>
        </form>

        <div id="ticket-confirmation" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-5 space-y-1.5">
          <p class="text-sm font-semibold text-emerald-800">Repair Request Submitted!</p>
          <p class="text-sm text-emerald-900">Your Ticket ID is <span id="created-ticket-code" class="font-mono font-bold"></span>. You can cancel it before a technician accepts it under <strong>My Repair Tickets</strong>.</p>
          <p id="created-ticket-media-note" class="text-xs text-emerald-800"></p>
        </div>
      </section>

      <!-- MY TICKETS LIST -->
      <section id="panel-my-tickets" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-slate-800">Your Submitted Repairs</h2>
          <button id="refresh-my-tickets" type="button"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-50">
            Refresh
          </button>
        </div>
        <div id="my-tickets-list" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://dmbkfmtzlckgykdjyouw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtYmtmbXR6bGNrZ3lrZGp5b3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0OTE2NjMsImV4cCI6MjExMTA2NzY2M30.TeLo14UrxSpTEW2yRhvOakBqzfl2qza4JeHj3n3ajMU";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let selectedFiles = [];

    const MAX_FILES = 5;
    const MAX_BYTES = 25 * 1024 * 1024;
    const MAX_IMAGE_DIM = 1280;
    const IMAGE_QUALITY = 0.75;
    const ALLOWED_TYPES = new Set([
      "image/jpeg", "image/png", "image/webp",
      "video/mp4", "video/webm", "video/quicktime",
      "audio/mpeg", "audio/mp4", "audio/webm", "audio/ogg", "audio/wav"
    ]);

    const USER_CANCEL_REASONS = [
      "Changed my mind",
      "Found another repair option",
      "Device started working",
      "Submitted by mistake",
      "Other"
    ];

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeBDPhone(raw) {
      const digits = raw.replace(/\D/g, "");
      if (digits.startsWith("880") && digits.length === 13) return "0" + digits.slice(3);
      return digits;
    }

    // Service location toggle
    const serviceLocationEl = document.getElementById("service_location");
    const serviceAddressWrap = document.getElementById("service-address-wrap");
    const serviceAddressEl = document.getElementById("service_address");

    function syncServiceLocationUI() {
      const isAtCustomer = serviceLocationEl.value === "At Customer Location";
      serviceAddressWrap.classList.toggle("hidden", !isAtCustomer);
      serviceAddressEl.required = isAtCustomer;
      if (!isAtCustomer) serviceAddressEl.value = "";
    }

    serviceLocationEl.addEventListener("change", syncServiceLocationUI);
    syncServiceLocationUI();

    // Auth tabs
    const authTabLogin = document.getElementById("auth-tab-login");
    const authTabRegister = document.getElementById("auth-tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    authTabLogin.addEventListener("click", () => {
      authTabLogin.className = "py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900";
      authTabRegister.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900";
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
    });

    authTabRegister.addEventListener("click", () => {
      authTabRegister.className = "py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900";
      authTabLogin.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900";
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
    });

    // Sign In
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      errEl.classList.add("hidden");

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("login-email").value.trim(),
        password: document.getElementById("login-password").value
      });

      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove("hidden");
      }
    });

    // Register with full fields + email verification
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("reg-error");
      const infoEl = document.getElementById("reg-info");
      errEl.classList.add("hidden");
      infoEl.classList.add("hidden");

      const fullName = document.getElementById("reg-name").value.trim();
      const phoneClean = normalizeBDPhone(document.getElementById("reg-phone").value.trim());
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const businessName = document.getElementById("reg-business-name").value.trim();
      const businessType = document.getElementById("reg-business-type").value;
      const businessAddress = document.getElementById("reg-business-address").value.trim();

      if (!/^01[3-9]\d{8}$/.test(phoneClean)) {
        errEl.textContent = "Enter a valid 11-digit Bangladeshi mobile number (e.g., 01712345678).";
        errEl.classList.remove("hidden");
        return;
      }

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin,
          data: {
            full_name: fullName,
            phone_number: phoneClean,
            email,
            business_name: businessName || null,
            business_type: businessType || null,
            business_address: businessAddress || null
          }
        }
      });

      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove("hidden");
        return;
      }

      if (!data.session) {
        infoEl.textContent = `Verification link sent to ${email}. Please verify your email, then sign in.`;
        infoEl.classList.remove("hidden");
        registerForm.reset();
      }
    });

    // Sign Out
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await db.auth.signOut();
    });

    // App tabs
    const tabNewTicket = document.getElementById("tab-new-ticket");
    const tabMyTickets = document.getElementById("tab-my-tickets");
    const panelNewTicket = document.getElementById("panel-new-ticket");
    const panelMyTickets = document.getElementById("panel-my-tickets");

    tabNewTicket.addEventListener("click", () => {
      tabNewTicket.className = "py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900";
      tabMyTickets.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900";
      panelNewTicket.classList.remove("hidden");
      panelMyTickets.classList.add("hidden");
    });

    tabMyTickets.addEventListener("click", () => {
      tabMyTickets.className = "py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-900";
      tabNewTicket.className = "py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900";
      panelMyTickets.classList.remove("hidden");
      panelNewTicket.classList.add("hidden");
      loadMyTickets();
    });

    document.getElementById("refresh-my-tickets").addEventListener("click", loadMyTickets);

    // Auth listener
    db.auth.onAuthStateChange(async (_event, session) => {
      currentUser = session?.user ?? null;

      if (currentUser) {
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("app-section").classList.remove("hidden");
        document.getElementById("user-bar").classList.remove("hidden");

        const { data: profile } = await db
          .from("profiles")
          .select("full_name, phone_number, business_name, business_address, business_type")
          .eq("id", currentUser.id)
          .single();

        currentProfile = profile || {};

        const displayName = profile?.full_name || currentUser.user_metadata?.full_name || currentUser.email;
        const displayPhone = profile?.phone_number || currentUser.user_metadata?.phone_number || "";
        const displayBiz = profile?.business_name ? `${displayPhone} · ${profile.business_name}` : displayPhone;

        document.getElementById("header-user-name").textContent = displayName;
        document.getElementById("header-user-meta").textContent = displayBiz;
        document.getElementById("customer_name").value = displayName;
        document.getElementById("phone_number").value = displayPhone;

        if (profile?.business_address) {
          serviceAddressEl.value = profile.business_address;
        }
      } else {
        currentProfile = null;
        document.getElementById("app-section").classList.add("hidden");
        document.getElementById("user-bar").classList.add("hidden");
        document.getElementById("auth-section").classList.remove("hidden");
      }
    });

    // File queue & photo compression
    const fileInput = document.getElementById("media_files");
    const fileSummary = document.getElementById("file-summary");
    const errorBox = document.getElementById("submit-error");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }
    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function validateFiles(files) {
      if (files.length > MAX_FILES) return `Please select at most ${MAX_FILES} files.`;
      for (const file of files) {
        if (!ALLOWED_TYPES.has(file.type)) {
          return `Unsupported file type for "${file.name}". Use JPG, PNG, WebP, MP4, MOV, WebM, MP3, M4A, OGG, or WAV.`;
        }
        if (file.size > MAX_BYTES) return `"${file.name}" exceeds the 25 MB limit.`;
      }
      return null;
    }

    function renderQueuedFiles() {
      const listEl = document.getElementById("queued-files-list");
      if (!selectedFiles.length) {
        fileSummary.textContent = "No files selected.";
        listEl.innerHTML = "";
        return;
      }

      const totalMB = (selectedFiles.reduce((acc, f) => acc + f.size, 0) / (1024 * 1024)).toFixed(1);
      fileSummary.textContent = `${selectedFiles.length} of ${MAX_FILES} file(s) queued (${totalMB} MB total).`;

      listEl.innerHTML = selectedFiles
        .map(
          (f, idx) => `
          <div class="flex items-center justify-between text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5">
            <span class="truncate pr-2">${escapeHtml(f.name)} (${(f.size / (1024 * 1024)).toFixed(1)} MB)</span>
            <button type="button" data-remove-idx="${idx}" class="text-red-600 font-semibold hover:underline shrink-0">
              Remove
            </button>
          </div>
        `
        )
        .join("");

      listEl.querySelectorAll("[data-remove-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-remove-idx"));
          selectedFiles.splice(idx, 1);
          renderQueuedFiles();
        });
      });
    }

    fileInput.addEventListener("change", () => {
      clearError();
      const newlyPicked = Array.from(fileInput.files);
      fileInput.value = "";
      if (!newlyPicked.length) return;

      const combined = [...selectedFiles, ...newlyPicked];
      const err = validateFiles(combined);
      if (err) return showError(err);

      selectedFiles = combined;
      renderQueuedFiles();
    });

    function compressImageFile(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith("image/")) return resolve(file);

        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          if (width > MAX_IMAGE_DIM || height > MAX_IMAGE_DIM) {
            if (width >= height) {
              height = Math.round((height * MAX_IMAGE_DIM) / width);
              width = MAX_IMAGE_DIM;
            } else {
              width = Math.round((width * MAX_IMAGE_DIM) / height);
              height = MAX_IMAGE_DIM;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);

          canvas.toBlob(
            (blob) => {
              if (!blob || blob.size >= file.size) return resolve(file);
              const baseName = file.name.replace(/\.[^.]+$/, "");
              resolve(new File([blob], `${baseName}.jpg`, { type: "image/jpeg", lastModified: Date.now() }));
            },
            "image/jpeg",
            IMAGE_QUALITY
          );
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(file);
        };

        img.src = objectUrl;
      });
    }

    // Submit repair ticket
    const repairForm = document.getElementById("repair-form");
    const submitBtn = document.getElementById("submit-btn");

    repairForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      if (!currentUser) return showError("Please sign in first.");

      const customerName = document.getElementById("customer_name").value.trim();
      const phoneClean = normalizeBDPhone(document.getElementById("phone_number").value.trim());
      const deviceType = document.getElementById("device_type").value;
      const deviceModel = document.getElementById("device_model").value.trim();
      const serviceLocation = serviceLocationEl.value;
      const serviceAddress = serviceAddressEl.value.trim();
      const issueDesc = document.getElementById("issue_description").value.trim();
      const files = [...selectedFiles];

      if (!/^01[3-9]\d{8}$/.test(phoneClean)) {
        return showError("Enter a valid 11-digit Bangladeshi mobile number (e.g., 01712345678).");
      }
      if (serviceLocation === "At Customer Location" && !serviceAddress) {
        return showError("Please enter your address or area for on-site repair or servicing.");
      }

      const fileErr = validateFiles(files);
      if (fileErr) return showError(fileErr);

      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading & Submitting...";

      try {
        const { data: ticket, error: insertErr } = await db
          .from("tickets")
          .insert({
            user_id: currentUser.id,
            customer_name: customerName,
            phone_number: phoneClean,
            device_type: deviceType,
            device_model: deviceModel,
            service_location: serviceLocation,
            service_address: serviceLocation === "At Customer Location" ? serviceAddress : null,
            issue_description: issueDesc
          })
          .select("id, ticket_code")
          .single();

        if (insertErr) throw insertErr;

        const uploadedPaths = [];
        for (let i = 0; i < files.length; i++) {
          const preparedFile = await compressImageFile(files[i]);
          const safeName = preparedFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const storagePath = `${currentUser.id}/${ticket.ticket_code}/${Date.now()}_${i}_${safeName}`;

          const { error: upErr } = await db.storage
            .from("repair-media")
            .upload(storagePath, preparedFile, { contentType: preparedFile.type, upsert: false });

          if (!upErr) {
            uploadedPaths.push({ path: storagePath, type: preparedFile.type, name: preparedFile.name });
          }
        }

        if (uploadedPaths.length > 0) {
          await db.from("tickets").update({ media_paths: uploadedPaths }).eq("id", ticket.id);
        }

        document.getElementById("created-ticket-code").textContent = ticket.ticket_code;
        document.getElementById("created-ticket-media-note").textContent =
          uploadedPaths.length > 0
            ? `${uploadedPaths.length} attachment(s) uploaded securely.`
            : "Submitted without media attachments.";
        document.getElementById("ticket-confirmation").classList.remove("hidden");

        document.getElementById("device_type").value = "";
        document.getElementById("device_model").value = "";
        document.getElementById("issue_description").value = "";
        serviceLocationEl.value = "Drop-off at Shop";
        syncServiceLocationUI();
        selectedFiles = [];
        renderQueuedFiles();
      } catch (err) {
        showError(err.message || "Could not submit your request. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Repair Request";
      }
    });

    function canCustomerCancel(ticket) {
      const hasNotes = Boolean(ticket.technician_notes && ticket.technician_notes.trim().length > 0);
      return (
        ticket.status === "Pending"
        && !ticket.accepted_by
        && !ticket.assigned_to
        && ticket.estimated_cost_bdt == null
        && !hasNotes
      );
    }

    function statusBadgeClass(status) {
      if (status === "Cancelled") return "bg-red-100 text-red-800";
      if (status === "Completed" || status === "Ready") return "bg-emerald-100 text-emerald-800";
      return "bg-blue-100 text-blue-800";
    }

    async function loadMyTickets() {
      const listEl = document.getElementById("my-tickets-list");
      listEl.innerHTML = `<p class="text-sm text-slate-500">Loading your repair requests...</p>`;

      const { data: tickets, error } = await db
        .from("tickets")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        listEl.innerHTML = `<p class="text-sm text-red-600">Error: ${escapeHtml(error.message)}</p>`;
        return;
      }

      if (!tickets.length) {
        listEl.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-6 text-sm text-slate-500">You haven't submitted any repair requests yet.</div>`;
        return;
      }

      listEl.innerHTML = "";
      for (const t of tickets) {
        const costText = t.estimated_cost_bdt != null
          ? `৳${Number(t.estimated_cost_bdt).toLocaleString("en-BD")}`
          : "Pending diagnosis";

        const locationLabel = t.service_location === "At Customer Location"
          ? `At Your Location (${escapeHtml(t.service_address || "Address not specified")})`
          : "Drop-off at Shop";

        const notesHtml = t.technician_notes
          ? `<p class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-700"><span class="font-semibold">Technician Note:</span> ${escapeHtml(t.technician_notes)}</p>`
          : "";

        const cancelInfoHtml = t.status === "Cancelled"
          ? `<p class="text-xs bg-red-50 border border-red-200 rounded-lg p-2.5 text-red-800"><span class="font-semibold">Cancelled (${escapeHtml(t.cancelled_by || "user")}):</span> ${escapeHtml(t.cancellation_reason || "No reason provided")}</p>`
          : "";

        const reasonOptions = USER_CANCEL_REASONS
          .map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`)
          .join("");

        const allowCancel = canCustomerCancel(t);
        const cancelPanelHtml = allowCancel
          ? `
            <div class="pt-3 border-t border-slate-100 space-y-2">
              <p class="text-xs text-slate-500">Not yet accepted — you can cancel this request. Attached files will be deleted to save storage.</p>
              <div class="flex flex-wrap items-center gap-2">
                <select data-role="cancel-reason" class="rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs bg-white">
                  <option value="">Select reason to cancel...</option>
                  ${reasonOptions}
                </select>
                <button type="button" data-role="cancel-btn"
                  class="px-3 py-1.5 rounded-lg border border-red-200 bg-red-50 hover:bg-red-100 text-red-700 text-xs font-semibold">
                  Cancel Request
                </button>
                <span data-role="cancel-msg" class="text-xs text-red-600"></span>
              </div>
            </div>
          `
          : "";

        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-2";
        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="font-mono font-bold text-blue-700">${escapeHtml(t.ticket_code)}</span>
              <span class="ml-2 font-semibold text-sm">${escapeHtml(t.device_type)} — ${escapeHtml(t.device_model)}</span>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${statusBadgeClass(t.status)}">${escapeHtml(t.status)}</span>
          </div>
          <p class="text-xs text-slate-600"><span class="font-semibold">Service Location:</span> ${locationLabel}</p>
          <p class="text-sm text-slate-600">${escapeHtml(t.issue_description)}</p>
          ${notesHtml}
          ${cancelInfoHtml}
          <div class="flex flex-wrap items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
            <span>Estimated Cost: <strong class="text-slate-800">${costText}</strong></span>
            <span>Submitted: ${new Date(t.created_at).toLocaleDateString("en-BD")}</span>
          </div>
          ${cancelPanelHtml}
        `;

        const cancelBtn = card.querySelector('[data-role="cancel-btn"]');
        if (cancelBtn) {
          cancelBtn.addEventListener("click", async () => {
            const reasonSel = card.querySelector('[data-role="cancel-reason"]');
            const msgEl = card.querySelector('[data-role="cancel-msg"]');
            const reason = reasonSel.value;

            if (!reason) {
              msgEl.textContent = "Please choose a cancellation reason first.";
              return;
            }
            if (!confirm(`Cancel ticket ${t.ticket_code} ("${reason}") and delete attached media files?`)) {
              return;
            }

            cancelBtn.disabled = true;
            msgEl.textContent = "Cancelling...";

            const filePaths = (Array.isArray(t.media_paths) ? t.media_paths : [])
              .map((m) => m.path)
              .filter(Boolean);

            if (filePaths.length > 0) {
              const { error: rmErr } = await db.storage.from("repair-media").remove(filePaths);
              if (rmErr) {
                cancelBtn.disabled = false;
                msgEl.textContent = `Could not delete files: ${rmErr.message}`;
                return;
              }
            }

            const { error: upErr } = await db
              .from("tickets")
              .update({
                status: "Cancelled",
                cancellation_reason: reason,
                cancelled_by: "user",
                cancelled_at: new Date().toISOString(),
                media_paths: []
              })
              .eq("id", t.id);

            if (upErr) {
              cancelBtn.disabled = false;
              msgEl.textContent = "Could not cancel (ticket may already be accepted or updated).";
              return;
            }

            loadMyTickets();
          });
        }

        listEl.appendChild(card);
      }
    }
  </script>
</body>
</html>
